<!doctype html><html><head><meta charset="utf-8"><title>The Window</title>
<style>body{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;background:#0f1419;color:#e6edf3;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
form{background:#161b22;padding:32px;border-radius:10px;width:320px;border:1px solid #30363d}h1{margin:0 0 6px;font-size:22px}p{color:#8b949e;margin:0 0 18px;font-size:13px}
input{width:100%;box-sizing:border-box;padding:10px;margin:6px 0 12px;background:#0d1117;border:1px solid #30363d;color:#e6edf3;border-radius:6px}
button{width:100%;padding:10px;background:#1f6feb;border:0;color:#fff;border-radius:6px;font-weight:600}.err{color:#f85149;font-size:13px}</style></head>
<body><form method="post" action="login"><h1>The Window</h1><p>desk analyst · crude, products, freight</p>
<label>your name</label><input name="name" placeholder="david" required><label>desk password</label><input name="password" type="password" required>
{% if error %}<div class="err">{{error}}</div>{% endif %}<button>enter</button></form></body></html>
